# Amplify build spec.
#
# This app is not a static export: sign-in, the session check, and the upload
# proxy are server routes, so Amplify must build it in SSR mode (WEB_COMPUTE).
# That happens automatically for a Next.js app with server output, but the
# build needs the runtime environment variables present at build time as well,
# because `next build` evaluates route handlers when collecting page data.
#
# Set these in the Amplify console (App settings > Environment variables).
# None of them use the NEXT_PUBLIC_ prefix, so none is compiled into the
# browser bundle:
#
#   NEXT_APP_ORIGIN            https://<your-domain>
#   NEXT_AWS_REGION            us-east-2
#   NEXT_EXTRACTION_API_URL    https://<function-url>.lambda-url.us-east-2.on.aws
#   NEXT_COGNITO_USER_POOL_ID  us-east-2_xxxxxxxxx
#   NEXT_COGNITO_CLIENT_ID     xxxxxxxxxxxxxxxxxxxxxxxxxx
#   NEXT_COGNITO_DOMAIN        https://<pool>.auth.<region>.amazoncognito.com
#   NEXT_COGNITO_SCOPES        openid email profile
#
# Leave the Cognito values unset to run the app open (no sign-in required).

version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --prefer-offline --no-audit --fund=false
    build:
      commands:
        # Amplify exposes console variables to the build shell but does not
        # write them to a file. Next reads process.env directly, so nothing
        # further is needed here.
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
